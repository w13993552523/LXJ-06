function temperatureChart(d){const min=Math.min(...d.temps),max=Math.max(...d.temps),lo=min-3,hi=max+4;const pts=d.temps.map((t,i)=>[22+i*36,154-(t-lo)/(hi-lo)*128]);const line=pts.map(p=>p.join(',')).join(' ');const label=(i)=>`<g transform="translate(${pts[i][0]-22} ${pts[i][1]-38})"><rect width="44" height="22" rx="3" fill="#d9d9d9"/><path d="m17 22 5 5 5-5" fill="#d9d9d9"/><text x="22" y="15" font-size="12" text-anchor="middle" fill="#303830">${d.temps[i]}°C</text></g>`;
 return `<svg class="chart" viewBox="0 0 224 184" role="img" aria-label="${d.name}配送温度曲线，最低${min}度，最高${max}度"><defs><linearGradient id="area" x1="0" x2="0" y1="0" y2="1"><stop stop-color="#def4e6"/><stop offset="1" stop-color="#f2fbf6"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#91b39c"/></filter></defs><path d="M${pts[0][0]},184 L${line.replaceAll(' ',' L')} L${pts.at(-1)[0]},184Z" fill="url(#area)"/><polyline points="${line}" fill="none" stroke="#d1ecdb" stroke-width="3"/>${pts.map(([x,y],i)=>`<circle cx="${x}" cy="${y}" r="4" fill="#fff" stroke="#34844b" stroke-width="3" filter="url(#shadow)"><title>${i+1}号采集点：${d.temps[i]}°C</title></circle>`).join('')}${label(0)}${label(d.temps.indexOf(max))}</svg>`;
}
function render(){
 const d=ingredients[selected];
 tabs.innerHTML=ingredients.map((x,i)=>`<button id="tab-${i}" role="tab" aria-selected="${i===selected}" tabindex="${i===selected?0:-1}" aria-controls="ingredient-panel" data-tab="${i}">${x.name}</button>`).join('');
 panel.setAttribute('aria-labelledby','tab-'+selected);
 panel.innerHTML=`<div class="white-card supplier"><strong class="card-title">原料供应商</strong><button id="supplier-open">${d.supplier}</button></div><details class="detail-stack" ${expanded?'open':''}><summary><span class="more-label">更多溯源信息</span><span class="less-label">折叠溯源信息</span></summary><div class="expanded-content"><div class="white-card"><h3 class="card-title">检测结果</h3><div class="result"><div class="result-count">应检<b>${d.count}</b>项 实检<b>${d.count}</b>项</div><div class="pass"><span class="check">✓</span><div><strong>检验合格</strong><small>已按验收项目完成检验</small></div></div></div></div><div class="white-card"><h3 class="card-title">检验凭证</h3><div class="docs">${['检验报告','批验报告',selected===0||selected===1?'动检票':'出厂凭证','卫生许可证'].map((x,i)=>`<button class="doc-btn" data-doc="${i}" aria-label="查看${d.name}${x}"><img src="${documentImage(x)}" alt="${x}演示样张"><span>${x}</span></button>`).join('')}</div></div><div class="white-card"><h3 class="card-title">门店配送</h3><div class="rows"><div class="data-row"><span>配送时间</span><span>${d.delivery}</span></div><div class="data-row"><span>收货时间</span><span>${d.receipt}</span></div></div></div><div class="white-card"><h3 class="card-title">配送温度</h3><div class="temperature-main"><div class="data-row"><span>食材存放温度</span><span>${d.storage}</span></div><div class="chart-layout">${temperatureChart(d)}<div class="temp-stats"><span>平均数<strong>${Math.round(d.temps.reduce((a,b)=>a+b)/6)}°C</strong></span><span>最高数<strong>${Math.max(...d.temps)}°C</strong></span><span>最低数<strong>${Math.min(...d.temps)}°C</strong></span></div></div></div></div><div class="white-card"><h3 class="card-title">健康证</h3><div class="docs">${d.people.map((x,i)=>`<button class="doc-btn" data-health="${i}" aria-label="查看${x}的健康证演示样张"><img src="${documentImage('健康证明',x)}" alt="${x}的健康证演示样张"><span>${x}</span></button>`).join('')}</div></div></div></details>`;
 panel.querySelector('details').addEventListener('toggle',e=>{expanded=e.currentTarget.open});
}
function openDialog(title,body){previousFocus=document.activeElement;document.querySelector('#dialog-title').textContent=title;document.querySelector('#dialog-body').innerHTML=body;document.body.style.overflow='hidden';dialog.showModal();document.querySelector('#dialog-close').focus()}
function closeDialog(){dialog.close()}
dialog.addEventListener('close',()=>{document.body.style.overflow='';clearInterval(processTimer);processTimer=null;if(previousFocus?.isConnected)previousFocus.focus()});
dialog.addEventListener('click',e=>{if(e.target===dialog){const r=dialog.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closeDialog()}});
document.querySelector('#dialog-close').addEventListener('click',closeDialog);
tabs.addEventListener('click',e=>{const t=e.target.closest('[data-tab]');if(t){expanded=panel.querySelector('details').open;selected=Number(t.dataset.tab);render();document.querySelector('#tab-'+selected).focus({preventScroll:true})}});
tabs.addEventListener('keydown',e=>{let next=selected;if(e.key==='ArrowRight')next=(selected+1)%ingredients.length;else if(e.key==='ArrowLeft')next=(selected+ingredients.length-1)%ingredients.length;else if(e.key==='Home')next=0;else if(e.key==='End')next=ingredients.length-1;else return;e.preventDefault();selected=next;render();document.querySelector('#tab-'+selected).focus()});
panel.addEventListener('click',e=>{const d=ingredients[selected],doc=e.target.closest('[data-doc]'),health=e.target.closest('[data-health]');if(e.target.closest('#supplier-open'))openDialog('原料供应商',`<dl class="dialog-info"><dt>供应商</dt><dd>${d.supplier}</dd><dt>原料名称</dt><dd>${d.name}</dd><dt>产地</dt><dd>${d.origin}</dd><dt>原料批次</dt><dd>${d.batch}</dd></dl><p class="sample-note">以上为交互演示数据</p>`);if(doc){const title=doc.querySelector('span').textContent;openDialog(title,`<img class="document-large" src="${documentImage(title)}" alt="${title}演示样张"><p class="sample-note">演示样张，不作为实际检验依据</p>`)}if(health){const name=d.people[Number(health.dataset.health)];openDialog('健康证 · '+name,`<img class="document-large" src="${documentImage('健康证明',name)}" alt="${name}健康证明演示样张"><p class="sample-note">演示样张，无实际效力</p>`)}});
document.querySelector('#craft-open').addEventListener('click',()=>openDialog('制作工艺',`<ol class="recipe">${recipe.map((x,i)=>`<li>${i+1}.${x}</li>`).join('')}</ol>`));
function drawStep(){document.querySelector('#step-view').innerHTML=`<div class="step-counter">${processStep+1} / ${recipe.length}</div><div class="step-content">${recipe[processStep]}</div><div class="step-progress">${recipe.map((_,i)=>`<i class="${i<=processStep?'active':''}"></i>`).join('')}</div><div class="step-controls"><button id="step-prev" ${processStep===0?'disabled':''}>上一步</button><button id="step-pause">${processTimer?'暂停':'自动播放'}</button><button id="step-next" ${processStep===recipe.length-1?'disabled':''}>下一步</button></div>`}
function toggleProcess(){if(processTimer){clearInterval(processTimer);processTimer=null}else{if(processStep===recipe.length-1)processStep=0;processTimer=setInterval(()=>{if(processStep<recipe.length-1)processStep++;else{clearInterval(processTimer);processTimer=null}drawStep()},3500)}drawStep()}

<button class="review-float" id="review-open" aria-label="去评价，填写顾客评价问卷"><svg viewBox="0 0 64 66" aria-hidden="true"><path d="M18 44C4 39 7 31 15 35M17 48C2 47 7 40 15 43" fill="#eda12e" stroke="#d78b23" stroke-width="1.2"/><path d="m25 56-5 5h11m11-5 5 5H37" fill="#ed9e24" stroke="#d68120" stroke-width="2" stroke-linecap="round"/><ellipse cx="32" cy="41" rx="18" ry="19" fill="#ffc33c" stroke="#eba124" stroke-width="1.5"/><path d="M27 10c-10-9-12 2-6 5-12-1-8 10 0 9" fill="#f38125"/><ellipse cx="30" cy="24" rx="15" ry="17" fill="#ffd24b" stroke="#eeb02b" stroke-width="1.2"/><circle cx="24" cy="23" r="2" fill="#544023"/><circle cx="35" cy="22" r="2" fill="#544023"/><path d="m26 28 7-1-3 5z" fill="#ee7e25"/><ellipse cx="20" cy="28" rx="3" ry="2" fill="#f5a33a"/><path d="M41 32q16 4 10 14" fill="none" stroke="#eda32b" stroke-width="7" stroke-linecap="round"/><path d="m31 37 18 2-3 17-18-2z" fill="#e14d30"/><path d="m38 41 1 3 4 1-3 2v4l-3-2-3 2 1-4-2-2 4-1z" fill="#ffe995"/><path d="M43 56c6-4 7-1 8 2-5 6-7 1-8-2" fill="#f2a938"/></svg><span>去评价</span></button>
<dialog id="survey-dialog" aria-labelledby="survey-title"><button type="button" class="survey-handle" aria-label="下滑关闭评价"></button><header class="survey-head"><div><h2 id="survey-title">您的反馈，让老乡鸡更透明</h2><p>花30秒，聊聊您的感受</p></div><button type="button" class="survey-dismiss">下次再说</button></header><form id="survey-form" novalidate><div class="survey-body" id="survey-body"></div><footer class="survey-foot"><p class="survey-error" id="survey-error" role="alert" hidden>请完成 Q1-Q3 后再提交（Q4 可以留空）</p><button type="submit" class="survey-submit">提交反馈</button><p class="survey-demo">交互演示 · 反馈仅保存在当前设备</p></footer></form></dialog>
<script>(()=>{
'use strict';
const sheet=document.querySelector('#survey-dialog'),form=document.querySelector('#survey-form'),body=document.querySelector('#survey-body'),error=document.querySelector('#survey-error'),entry=document.querySelector('#review-open');
const q2=['更放心了，下次还来','稍微安心一点','感觉差不多','反而有点担心'];
const q3=['它从哪儿来','吃了什么、用了什么药','一路冷不冷','后厨怎么做的','有没有检测过','门店干不干净','做饭的人有没有健康证','其他（选填）'];
const stars=['需要改进','不太满意','一般','比较满意','非常满意'];
const key='lxj-consumer-survey-v1';let draft={rating:0,trust:'',want:[],concern:'',other:'',comment:''},focusBefore=null,success=false;
try{const saved=JSON.parse(localStorage.getItem(key)||'null');if(saved?.answers)draft={...draft,...saved.answers}}catch{}
function question(n,title,content,optional=false){return `<section class="survey-question" aria-labelledby="survey-q${n}"><h3 id="survey-q${n}" tabindex="-1"><span class="q-index">${n}</span>${title}<span class="${optional?'q-optional':'q-required'}">${optional?'（选填）':'*'}</span></h3>${content}</section>`}
function textField(id,placeholder){return `<textarea id="${id}" maxlength="100" placeholder="${placeholder}" aria-label="${placeholder}"></textarea><div class="survey-counter"><span id="${id}-count">0</span>/100</div>`}
function draw(){success=false;body.innerHTML=question(1,'这份“食材档案”，您打几分？',`<div class="survey-stars" role="radiogroup" aria-label="食材档案评分">${stars.map((s,i)=>`<label title="${i+1}分，${s}"><input type="radio" name="rating" value="${i+1}" aria-label="${i+1}分，${s}"><span aria-hidden="true">★</span></label>`).join('')}</div><p class="star-caption">请点星打分</p>`)+question(2,'看完之后，您对这顿饭吃得更放心了吗？',`<div class="survey-options">${q2.map((s,i)=>`<label class="survey-option"><input type="radio" name="trust" value="${'abcd'[i]}" required><span>${s}</span></label>`).join('')}</div><div class="survey-followup" hidden><p>抱歉让您有这样的感受，请告诉我们哪里出了问题</p>${textField('survey-concern','能说说您在担心什么吗？我们想改（选填，≤100字）')}</div>`)+question(3,'关于这道菜，您还想看到哪些“背后的故事”？<span class="q-optional">（多选）</span>',`<div class="survey-options">${q3.map((s,i)=>`<label class="survey-option"><input type="checkbox" name="want" value="${i}"><span>${s}</span></label>`).join('')}</div><div class="survey-other" hidden>${textField('survey-other','还想了解什么？（选填，≤100字）')}</div>`)+question(4,'想吐槽、想表扬、想提建议，都写在这儿吧',textField('survey-comment','比如：想看更详细的农场照片…'),true);
body.querySelectorAll('[name=rating]').forEach(x=>x.checked=Number(x.value)===draft.rating);body.querySelectorAll('[name=trust]').forEach(x=>x.checked=x.value===draft.trust);body.querySelectorAll('[name=want]').forEach(x=>x.checked=draft.want.includes(Number(x.value)));
for(const [id,field] of [['concern','concern'],['other','other'],['comment','comment']]){body.querySelector('#survey-'+id).value=draft[field];body.querySelector('#survey-'+id+'-count').textContent=draft[field].length}
update();error.hidden=true;form.querySelector('.survey-submit').textContent='提交反馈';form.querySelector('.survey-demo').textContent='交互演示 · 反馈仅保存在当前设备';body.scrollTop=0}
function update(){body.querySelectorAll('.survey-stars label').forEach((x,i)=>x.classList.toggle('is-lit',i<draft.rating));body.querySelector('.star-caption').textContent=draft.rating?stars[draft.rating-1]:'请点星打分';body.querySelector('.survey-followup').hidden=draft.trust!=='d';body.querySelector('.survey-other').hidden=!draft.want.includes(7)}
function close(){sheet.close()}
entry.addEventListener('click',()=>{focusBefore=document.activeElement;draw();sheet.showModal();document.body.style.overflow='hidden';sheet.querySelector('.survey-dismiss').focus({preventScroll:true})});
sheet.querySelector('.survey-dismiss').addEventListener('click',close);sheet.addEventListener('close',()=>{document.body.style.overflow='';focusBefore?.focus({preventScroll:true})});
sheet.addEventListener('click',e=>{if(e.target===sheet){const r=sheet.getBoundingClientRect();if(e.clientY<r.top||e.clientX<r.left||e.clientX>r.right)close()}});
body.addEventListener('change',e=>{const x=e.target;if(x.name==='rating')draft.rating=Number(x.value);if(x.name==='trust')draft.trust=x.value;if(x.name==='want')draft.want=Array.from(body.querySelectorAll('[name=want]:checked'),x=>Number(x.value));update();error.hidden=true});
body.addEventListener('input',e=>{const fields={'survey-concern':'concern','survey-other':'other','survey-comment':'comment'},field=fields[e.target.id];if(field){draft[field]=e.target.value.slice(0,100);body.querySelector('#'+e.target.id+'-count').textContent=draft[field].length}});
let starDragging=false;body.addEventListener('pointerdown',e=>{if(e.target.closest('.survey-stars'))starDragging=true});body.addEventListener('pointermove',e=>{if(!starDragging)return;const row=body.querySelector('.survey-stars'),r=row.getBoundingClientRect();if(e.clientY<r.top-25||e.clientY>r.bottom+25)return;draft.rating=Math.min(5,Math.max(1,Math.ceil((e.clientX-r.left)/r.width*5)));body.querySelector(`[name=rating][value="${draft.rating}"]`).checked=true;update()});document.addEventListener('pointerup',()=>starDragging=false);
let swipeStart=0;const handle=sheet.querySelector('.survey-handle');handle.addEventListener('pointerdown',e=>{swipeStart=e.clientY;handle.setPointerCapture?.(e.pointerId)});handle.addEventListener('pointerup',e=>{if(e.clientY-swipeStart>60)close()});
form.addEventListener('submit',e=>{e.preventDefault();if(success){close();return}const missing=!draft.rating?1:!draft.trust?2:!draft.want.length?3:0;if(missing){error.hidden=false;body.querySelector('#survey-q'+missing).scrollIntoView({block:'center',behavior:'smooth'});body.querySelector('#survey-q'+missing).focus({preventScroll:true});return}
const payload={answers:{...draft,concern:draft.trust==='d'?draft.concern:'',other:draft.want.includes(7)?draft.other:''},risk_flag:draft.trust==='d',report:'classic-edamame-chicken',submitted_at:new Date().toISOString()};
try{localStorage.setItem(key,JSON.stringify(payload))}catch{error.textContent='当前设备无法保存反馈，请稍后再试';error.hidden=false;return}
success=true;error.hidden=true;body.innerHTML='<div class="survey-success"><span class="success-check">✓</span><h3>谢谢您的反馈！</h3><p>本次评价已保存在当前设备。<br>感谢您帮助老乡鸡做得更好。</p></div>';body.scrollTop=0;form.querySelector('.survey-submit').textContent='返回溯源页面';form.querySelector('.survey-demo').textContent='演示反馈尚未接入后台，不发放会员积分';sheet.querySelector('.survey-submit').focus()});
})();
</script></body></html>
